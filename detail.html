      const map = { Common: t.common, Uncommon: t.uncommon, Rare: t.rare };

      if (params.get('id')) {
        id = parseInt(params.get('id'));
      } else if (hashMatch) {
        id = parseInt(hashMatch[1]);

        const urlId = window.location.href.match(/id[=](\d+)/);

    // â”€â”€ Edge-TTS Karaoke Player â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    let _karaokeAudio = null;
    let _karaokeRaf = null;
    let _karaokeWords = null;
    let _karaokeSpans = null;

    function renderKaraokeWords(text, container) {
      // Use the original pokemon description text (with spaces & punctuation preserved)
      // but map the pre-computed word timings onto it
      if (!_karaokeWords) {
        container.innerHTML = `<span>${text}</span>`;
        return;
      }
      let html = '';
      let textIdx = 0;
      const textLen = text.length;

      for (const w of _karaokeWords) {
        const wText = w.text;
        // Find this word in the original text starting from current position
        const foundIdx = text.indexOf(wText, textIdx);
        if (foundIdx !== -1) {
          // Add any skipped characters (spaces, punctuation) before this word
          if (foundIdx > textIdx) {
            const skipped = text.slice(textIdx, foundIdx);
            html += `<span class="karaoke-word karaoke-word--static">${skipped}</span>`;
          }
          // Add the actual word with timing data
          html += `<span class="karaoke-word" data-start="${w.startMs}" data-end="${w.startMs + w.durationMs}">${wText}</span>`;
          textIdx = foundIdx + wText.length;
        } else {
          // Word not found in original text â€” just append it
          html += `<span class="karaoke-word" data-start="${w.startMs}" data-end="${w.startMs + w.durationMs}">${wText}</span>`;
        }
      }
      // Append any remaining text after the last word
      if (textIdx < textLen) {
        const remaining = text.slice(textIdx);
        html += `<span class="karaoke-word karaoke-word--static">${remaining}</span>`;
      }

      container.innerHTML = html;
      _karaokeSpans = container.querySelectorAll('.karaoke-word[data-start]');
    }

    function startKaraokeTick() {
      function tick() {
        if (!_karaokeAudio || !_karaokeSpans) return;
        const nowMs = _karaokeAudio.currentTime * 1000;
        _karaokeSpans.forEach(s => {
          const start = +s.dataset.start;
          const end = +s.dataset.end;
          s.classList.toggle('karaoke-active', nowMs >= start && nowMs < end);
          s.classList.toggle('karaoke-done', nowMs >= end);
        });
        _karaokeRaf = requestAnimationFrame(tick);
      }
      _karaokeRaf = requestAnimationFrame(tick);
    }

    function stopKaraokeTick() {
      if (_karaokeRaf) { cancelAnimationFrame(_karaokeRaf); _karaokeRaf = null; }
    }

    function clearKaraokeHighlights() {
      if (_karaokeSpans) {
        _karaokeSpans.forEach(s => {
          s.classList.remove('karaoke-active');
          s.classList.remove('karaoke-done');
        });
      }
    }

    async function playKaraokeAudio(voiceLang) {
      if (!pokemon) return;
      const pokemonId = pokemon.id;
      const jsonPath = `output/karaoke/${String(pokemonId).padStart(3, '0')}/${voiceLang}/karaoke_${voiceLang}.json`;
      const mp3Path = `output/karaoke/${String(pokemonId).padStart(3, '0')}/${voiceLang}/audio_${voiceLang}.mp3`;

      // Stop any previous playback
      stopKaraokeTick();
      if (_karaokeAudio) { _karaokeAudio.pause(); _karaokeAudio.currentTime = 0; _karaokeAudio = null; }
      clearKaraokeHighlights();

      const descEl = document.getElementById('descText');
      const text = pokemon.description[voiceLang] || pokemon.description.en;

      try {
        // Fetch word timings
        const resp = await fetch(jsonPath);
        if (!resp.ok) throw new Error('JSON not found');
        _karaokeWords = await resp.json();
      } catch {
        // No pre-generated audio â€” fall back to Web Speech API
        _karaokeWords = null;
        playDescVoice(voiceLang);
        return;
      }

      // Render word spans
      renderKaraokeWords(text, descEl);

      // Create audio
      _karaokeAudio = new Audio(mp3Path);
      _karaokeAudio.play().catch(() => {});

      startKaraokeTick();

      _karaokeAudio.addEventListener('ended', () => {
        stopKaraokeTick();
        clearKaraokeHighlights();
        _karaokeWords = null;
        _karaokeSpans = null;
        descEl.textContent = text;
      }, { once: true });
    }

    // â”€â”€ Legacy Web Speech API â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    let _voiceLangSave = null;
    let _currentVoiceText = '';
    let _cancelKaraoke = null;

    function playVoice(text, lang) {
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(text);
        const langMap = { zh: 'zh-TW', en: 'en-US', es: 'es-SV' };
        utterance.lang = langMap[lang] || lang;
        utterance.rate = 0.85;
        utterance.pitch = 1.2;
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
      }
    }

    // Split text into speakable chunks for word-by-word playback
    // zh: by clauses (2-4 chars), en/es: by words
    function splitSpeakChunks(text, lang) {
      if (lang === 'zh') {
        // Split Chinese into ~3-char chunks
        var raw = [];
        var current = '';
        for (var i = 0; i < text.length; i++) {
          current += text[i];
          var isPunct = /[ï¼Œã€‚ï¼ï¼Ÿã€ï¼›ï¼š]/.test(text[i]);
          if (isPunct) {
            raw.push(current);
            current = '';
          } else if (current.length >= 3) {
            raw.push(current);
            current = '';
          }
        }
        if (current) raw.push(current);
        // Merge standalone punctuation into previous chunk
        var chunks = [];
        for (var j = 0; j < raw.length; j++) {
          if (/^[ï¼Œã€‚ï¼ï¼Ÿã€ï¼›ï¼š]$/.test(raw[j]) && chunks.length > 0) {
            chunks[chunks.length - 1] += raw[j];
          } else {
            chunks.push(raw[j]);
          }
        }
        return chunks;
      } else {
        // en/es: split by words
        return text.match(/\S+\s*/g) || [text];
      }
    }

    // Build char-highlight span wrapper
    function wrapCharSpans(text) {
      var html = '';
      for (var i = 0; i < text.length; i++) {
        var c = text[i];
        var esc = c === '<' ? '&lt;' : c === '>' ? '&gt;' : c === '&' ? '&amp;' : c;
        html += '<span class="karaoke-char" data-idx="' + i + '"' + (c === ' ' ? ' style="white-space:pre"' : '') + '>' + esc + '</span>';
      }
      return html;
    }

    function karaokeUpdate(el, text, endIdx) {
      var spans = el.querySelectorAll('.karaoke-char');
      for (var i = 0; i < spans.length; i++) {
        spans[i].classList.toggle('karaoke-active', i < endIdx);
      }
    }

    function karaokeClear(el) {
      var spans = el.querySelectorAll('.karaoke-active');
      for (var i = 0; i < spans.length; i++) {
        spans[i].classList.remove('karaoke-active');
      }
    }

    function playDescVoice(voiceLang) {
      if (!('speechSynthesis' in window)) return;
      const currentLang = POKOPIA_DEX.getLang();
      const descEl = document.getElementById('descText');
      if (!descEl || !pokemon) return;

      const text = pokemon.description[voiceLang] || pokemon.description.en;
      _voiceLangSave = currentLang;
      _currentVoiceText = text;
      descEl.innerHTML = wrapCharSpans(text);

      window.speechSynthesis.cancel();
      if (_cancelKaraoke) { _cancelKaraoke(); _cancelKaraoke = null; }

      var langMap = { zh: 'zh-TW', en: 'en-US', es: 'es-SV' };

      if (voiceLang === 'zh') {
        // Chinese: always use chunk-by-chunk playback (onboundary unreliable for zh)
        var chunks = splitSpeakChunks(text, 'zh');
        var charOffset = 0;
        var chunkIdx = 0;
        var isCancelled = false;

        function speakNext() {
          if (isCancelled || chunkIdx >= chunks.length) return;
          var chunk = chunks[chunkIdx];
          var thisOffset = charOffset;
          var utt = new SpeechSynthesisUtterance(chunk);
          utt.lang = langMap[voiceLang] || voiceLang;
          utt.rate = 0.8;
          utt.pitch = 1.2;
          utt.onend = function() {
            karaokeUpdate(descEl, text, thisOffset + chunk.length);
            charOffset += chunk.length;
            chunkIdx++;
            speakNext();
          };
          utt.onerror = function() {
            charOffset += chunk.length;
            chunkIdx++;
            speakNext();
          };
          window.speechSynthesis.speak(utt);
        }

        speakNext();

        _cancelKaraoke = function() { isCancelled = true; window.speechSynthesis.cancel(); };

        var checkDone = setInterval(function() {
          if (isCancelled || chunkIdx >= chunks.length) {
            clearInterval(checkDone);
            if (!isCancelled) {
              karaokeClear(descEl);
              if (_voiceLangSave) {
                descEl.textContent = POKOPIA_DEX.getDescription(pokemon, _voiceLangSave);
                _voiceLangSave = null;
              }
            }
          }
        }, 200);

      } else {
        // en/es: speak whole sentence, use onboundary for per-word highlight
        // Falls back to chunk-by-chunk if onboundary never fires
        var utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = langMap[voiceLang] || voiceLang;
        utterance.rate = 0.8;
        utterance.pitch = 1.2;

        var boundaryFired = false;
        var lastCharIdx = -1;
        var fallbackTimers = [];

        utterance.onboundary = function(event) {
          boundaryFired = true;
          fallbackTimers.forEach(function(t) { clearTimeout(t); });
          fallbackTimers = [];
          if (event.name === 'word') {
            var ci = event.charIndex;
            if (ci > lastCharIdx) {
              lastCharIdx = ci;
              karaokeUpdate(descEl, text, ci + 1);
            }
          }
        };

        utterance.onstart = function() {
          // Fallback: if onboundary never fires (Android Chrome), switch to chunk playback
          setTimeout(function() {
            if (!boundaryFired) {
              window.speechSynthesis.cancel();
              // Fallback to chunk-by-chunk
              var chunks = splitSpeakChunks(text, voiceLang);
              var charOffset2 = 0;
              var chunkIdx2 = 0;
              var isCancelled2 = false;

              function speakNextChunk() {
                if (isCancelled2 || chunkIdx2 >= chunks.length) return;
                var chunk = chunks[chunkIdx2];
                var thisOffset = charOffset2;
                var utt2 = new SpeechSynthesisUtterance(chunk);
                utt2.lang = langMap[voiceLang] || voiceLang;
                utt2.rate = 0.8;
                utt2.pitch = 1.2;
                utt2.onend = function() {
                  karaokeUpdate(descEl, text, thisOffset + chunk.length);
                  charOffset2 += chunk.length;
                  chunkIdx2++;
                  speakNextChunk();
                };
                utt2.onerror = function() {
                  charOffset2 += chunk.length;
                  chunkIdx2++;
                  speakNextChunk();
                };
                window.speechSynthesis.speak(utt2);
              }

              speakNextChunk();

              _cancelKaraoke = function() { isCancelled2 = true; window.speechSynthesis.cancel(); };

              var checkDone2 = setInterval(function() {
                if (isCancelled2 || chunkIdx2 >= chunks.length) {
                  clearInterval(checkDone2);
                  if (!isCancelled2) {
                    karaokeClear(descEl);
                    if (_voiceLangSave) {
                      descEl.textContent = POKOPIA_DEX.getDescription(pokemon, _voiceLangSave);
                      _voiceLangSave = null;
                    }
                  }
                }
              }, 200);
            }
          }, 300);
        };

        utterance.onend = function() {
          fallbackTimers.forEach(function(t) { clearTimeout(t); });
          karaokeUpdate(descEl, text, text.length);
          setTimeout(function() {
            karaokeClear(descEl);
            if (_voiceLangSave) {
              descEl.textContent = POKOPIA_DEX.getDescription(pokemon, _voiceLangSave);
              _voiceLangSave = null;
            }
          }, 500);
        };

        _cancelKaraoke = function() { window.speechSynthesis.cancel(); };

        window.speechSynthesis.speak(utterance);
      }
    }

    init();
  </script>

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then(reg => {
          console.log('SW registered:', reg.scope);
        }).catch(err => {
          console.log('SW registration failed:', err);
        });
      });
    }
  </script>
