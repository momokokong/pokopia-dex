<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokopia 卡拉 OK 測試播放器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      font-size: 1.2rem;
      color: #fff;
      margin-bottom: 24px;
      text-align: center;
    }

    /* ── Language Tabs ── */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .tab {
      padding: 8px 20px;
      border-radius: 8px;
      border: 1.5px solid #333;
      background: #1a1a2e;
      color: #888;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab.active {
      border-color: #f0c040;
      color: #f0c040;
      background: #1f1a10;
    }

    /* ── Player Panel ── */
    .player {
      width: 100%;
      max-width: 600px;
      background: #16162a;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
    }

    .lang-badge {
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 12px;
    }
    .lang-badge.zh { background: #e63946; color: #fff; }
    .lang-badge.en { background: #457b9d; color: #fff; }
    .lang-badge.es { background: #2a9d8f; color: #fff; }

    .voice-name {
      font-size: 0.75rem;
      color: #666;
      margin-bottom: 16px;
    }

    /* ── Audio Controls ── */
    .audio-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }
    audio { flex: 1; height: 36px; }

    /* ── Progress Bar ── */
    .progress-wrap {
      position: relative;
      height: 6px;
      background: #2a2a45;
      border-radius: 3px;
      margin-bottom: 16px;
      cursor: pointer;
    }
    .progress-fill {
      height: 100%;
      background: #f0c040;
      border-radius: 3px;
      width: 0%;
      transition: width 0.05s linear;
    }

    .time-display {
      font-size: 0.75rem;
      color: #555;
      display: flex;
      justify-content: space-between;
    }

    /* ── Karaoke Text ── */
    .karaoke-line {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 2.2;
      text-align: center;
      min-height: 3.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.15em;
      padding: 16px 0;
    }
    .karaoke-line .kw {
      display: inline-block;
      transition: color 0.08s;
      color: #555;
      position: relative;
    }
    .karaoke-line .kw.active {
      color: #fff;
    }
    .karaoke-line .kw.highlight {
      color: #f0c040;
    }
    .karaoke-line .kw.done {
      color: #666;
    }

    /* ── Debug Timeline ── */
    .debug-section {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #222;
    }
    .debug-toggle {
      font-size: 0.75rem;
      color: #444;
      cursor: pointer;
      user-select: none;
    }
    .debug-toggle:hover { color: #888; }
    .debug-rows {
      display: none;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 8px;
    }
    .debug-rows.open { display: flex; }
    .debug-chip {
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: #1e1e32;
      color: #444;
      white-space: nowrap;
    }
    .debug-chip.active { background: #3a2e00; color: #f0c040; }
    .debug-chip.done { background: #111; color: #333; }

    /* ── Sync Quality ── */
    .sync-info {
      margin-top: 16px;
      padding: 12px;
      background: #0f0f1a;
      border-radius: 8px;
      font-size: 0.75rem;
      color: #555;
    }
    .sync-info span { color: #888; }
  </style>
</head>
<body>

<h1>🎤 Pokopia 卡拉 OK 逐字高亮測試</h1>

<!-- Language Tabs -->
<div class="tabs">
  <button class="tab active" data-lang="zh">🇹🇼 中文</button>
  <button class="tab" data-lang="en">🇺🇸 English</button>
  <button class="tab" data-lang="es">🇪🇸 Español</button>
</div>

<!-- Player -->
<div class="player">
  <div class="lang-badge zh" id="langBadge">中文</div>
  <div class="voice-name" id="voiceName">zh-TW-HsiaoChenNeural</div>

  <div class="audio-row">
    <audio id="audio" controls></audio>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div class="time-display">
    <span id="currentTime">0:00.0</span>
    <span id="totalTime">0:00.0</span>
  </div>

  <div class="karaoke-line" id="karaokeLine"></div>

  <div class="debug-section">
    <div class="debug-toggle" id="debugToggle">▸ 顯示時間軸偵錯</div>
    <div class="debug-rows" id="debugRows"></div>
  </div>

  <div class="sync-info" id="syncInfo">
    currentTime = <span id="ct">0</span> ms &nbsp;|&nbsp;
    wordStart = <span id="ws">0</span> ms &nbsp;|&nbsp;
    delta = <span id="delta">0</span> ms
  </div>
</div>

<script>
/* =====================================================================
   皮卡丘三語測試資料（直接內嵌，不依赖外部 JSON）
   ===================================================================== */

const LANGS = {
  zh: {
    badge: '中文',
    badgeClass: 'zh',
    voice: 'zh-TW-HsiaoChenNeural',
    audioUrl: 'tools/edge-tts/output/zh-test/audio_zh.mp3',
    words: [
      { text: '皮',     startMs: 100,  durationMs: 175 },
      { text: '卡丘的', startMs: 312,  durationMs: 512 },
      { text: '頰',     startMs: 875,  durationMs: 187 },
      { text: '袋',     startMs: 1075, durationMs: 150 },
      { text: '柔軟',   startMs: 1237, durationMs: 312 },
      { text: '且',     startMs: 1600, durationMs: 150 },
      { text: '有',     startMs: 1762, durationMs: 112 },
      { text: '彈性',   startMs: 1925, durationMs: 500 },
      { text: '能',     startMs: 2725, durationMs: 125 },
      { text: '產生',   startMs: 2900, durationMs: 325 },
      { text: '強大的', startMs: 3287, durationMs: 437 },
      { text: '電力',   startMs: 3775, durationMs: 475 },
    ]
  },
  en: {
    badge: 'English',
    badgeClass: 'en',
    voice: 'en-US-AnaNeural',
    audioUrl: 'tools/edge-tts/output/en-test/audio_en.mp3',
    words: [
      { text: 'Pikachu',    startMs: 100,  durationMs: 637 },
      { text: 'has',        startMs: 750,  durationMs: 262 },
      { text: 'soft',       startMs: 1025, durationMs: 450 },
      { text: 'and',        startMs: 1487, durationMs: 162 },
      { text: 'stretchy',   startMs: 1662, durationMs: 512 },
      { text: 'cheek',      startMs: 2187, durationMs: 337 },
      { text: 'sacs',       startMs: 2537, durationMs: 487 },
      { text: 'that',       startMs: 3037, durationMs: 200 },
      { text: 'can',        startMs: 3250, durationMs: 200 },
      { text: 'generate',   startMs: 3462, durationMs: 537 },
      { text: 'powerful',   startMs: 4012, durationMs: 562 },
      { text: 'electricity',startMs: 4587, durationMs: 837 },
    ]
  },
  es: {
    badge: 'Español',
    badgeClass: 'es',
    voice: 'es-MX-JorgeNeural',
    audioUrl: 'tools/edge-tts/output/es-test/audio_es.mp3',
    words: [
      { text: 'Pikachu',      startMs: 100,  durationMs: 462 },
      { text: 'tiene',        startMs: 575,  durationMs: 262 },
      { text: 'mejillas',     startMs: 850,  durationMs: 450 },
      { text: 'suaves',       startMs: 1312, durationMs: 400 },
      { text: 'y',            startMs: 1725, durationMs: 50  },
      { text: 'elásticas',    startMs: 1787, durationMs: 625 },
      { text: 'que',          startMs: 2425, durationMs: 137 },
      { text: 'pueden',       startMs: 2575, durationMs: 312 },
      { text: 'generar',      startMs: 2900, durationMs: 437 },
      { text: 'electricidad', startMs: 3350, durationMs: 700 },
      { text: 'poderosa',     startMs: 4062, durationMs: 600 },
    ]
  }
};

/* =====================================================================
   DOM refs
   ===================================================================== */
const audio      = document.getElementById('audio');
const langBadge  = document.getElementById('langBadge');
const voiceName  = document.getElementById('voiceName');
const karaokeLine= document.getElementById('karaokeLine');
const progressFill= document.getElementById('progressFill');
const progressWrap= document.getElementById('progressWrap');
const currentTimeEl= document.getElementById('currentTime');
const totalTimeEl = document.getElementById('totalTime');
const debugRows  = document.getElementById('debugRows');
const debugToggle= document.getElementById('debugToggle');
const ctEl       = document.getElementById('ct');
const wsEl       = document.getElementById('ws');
const deltaEl    = document.getElementById('delta');

let rafId = null;
let currentLang = null;
let words = [];

/* =====================================================================
   Build karaoke spans + debug chips
   ===================================================================== */
function buildUI(langData) {
  words = langData.words;

  /* Karaoke line */
  karaokeLine.innerHTML = '';
  langData.words.forEach((w, i) => {
    const span = document.createElement('span');
    span.className = 'kw';
    span.textContent = w.text;
    span.dataset.index = i;
    karaokeLine.appendChild(span);
  });

  /* Debug chips */
  debugRows.innerHTML = '';
  langData.words.forEach((w, i) => {
    const chip = document.createElement('div');
    chip.className = 'debug-chip';
    chip.id = 'chip-' + i;
    chip.textContent = `${w.startMs}ms ${w.text}`;
    debugRows.appendChild(chip);
  });
}

/* =====================================================================
   Format ms → M:SS.m
   ===================================================================== */
function fmt(ms) {
  const s = ms / 1000;
  const m = Math.floor(s / 60);
  const sec = (s % 60).toFixed(1).padStart(4, '0');
  return `${m}:${sec}`;
}

/* =====================================================================
   Switch language
   ===================================================================== */
function switchLang(lang) {
  currentLang = lang;
  const d = LANGS[lang];

  langBadge.textContent = d.badge;
  langBadge.className = 'lang-badge ' + d.badgeClass;
  voiceName.textContent = d.voice;
  audio.src = d.audioUrl;
  audio.load();

  buildUI(d);
}

/* =====================================================================
   RAF highlight loop
   ===================================================================== */
function tick() {
  const nowMs = audio.currentTime * 1000;
  const spans = karaokeLine.querySelectorAll('.kw');

  let nearestIdx = -1;
  let minDelta = Infinity;

  spans.forEach((span, i) => {
    const w = words[i];
    const end = w.startMs + w.durationMs;

    span.classList.remove('active', 'highlight', 'done');

    if (nowMs >= w.startMs && nowMs < end) {
      span.classList.add('active');
      nearestIdx = i;
    } else if (nowMs >= end) {
      span.classList.add('done');
    } else {
      /* before start: default dim */
    }
  });

  /* Progress bar */
  if (audio.duration) {
    progressFill.style.width = ((nowMs / 1000) / audio.duration * 100) + '%';
  }

  /* Debug sync info */
  if (nearestIdx >= 0) {
    const w = words[nearestIdx];
    const delta = Math.round(nowMs - w.startMs);
    wsEl.textContent = Math.round(w.startMs);
    ctEl.textContent = Math.round(nowMs);
    deltaEl.textContent = delta;
    spans[nearestIdx].classList.add('highlight');
  }

  /* Debug chips */
  document.querySelectorAll('.debug-chip').forEach((chip, i) => {
    chip.classList.remove('active', 'done');
    const w = words[i];
    if (nowMs >= w.startMs + w.durationMs) chip.classList.add('done');
    else if (nowMs >= w.startMs && nowMs < w.startMs + w.durationMs) chip.classList.add('active');
  });

  rafId = requestAnimationFrame(tick);
}

/* =====================================================================
   Init / events
   ===================================================================== */
switchLang('zh');

/* Tab switching */
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    switchLang(btn.dataset.lang);
    audio.play().catch(() => {});
  });
});

/* Audio events */
audio.addEventListener('loadedmetadata', () => {
  totalTimeEl.textContent = fmt(audio.duration * 1000);
});

audio.addEventListener('play', () => {
  cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(tick);
});

audio.addEventListener('pause', () => {
  cancelAnimationFrame(rafId);
});

audio.addEventListener('ended', () => {
  cancelAnimationFrame(rafId);
  progressFill.style.width = '100%';
  /* mark all done */
  karaokeLine.querySelectorAll('.kw').forEach(s => {
    s.classList.remove('active', 'highlight');
    s.classList.add('done');
  });
});

/* Click on progress bar to seek */
progressWrap.addEventListener('click', (e) => {
  const rect = progressWrap.getBoundingClientRect();
  const ratio = (e.clientX - rect.left) / rect.width;
  audio.currentTime = ratio * audio.duration;
});

/* Debug toggle */
debugToggle.addEventListener('click', () => {
  debugRows.classList.toggle('open');
  debugToggle.textContent = debugRows.classList.contains('open')
    ? '▾ 隱藏時間軸偵錯'
    : '▸ 顯示時間軸偵錯';
});

/* Click word to seek to that position */
karaokeLine.addEventListener('click', (e) => {
  if (e.target.classList.contains('kw')) {
    const idx = parseInt(e.target.dataset.index);
    audio.currentTime = words[idx].startMs / 1000;
    audio.play().catch(() => {});
  }
});
</script>
</body>
</html>
