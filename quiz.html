<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pokopia 猜謎挑戰 - 學習三語</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background-color: #fdf6e3;
            font-family: 'Klee One', 'Comic Sans MS', cursive, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background: #ffcb05;
            color: #3c5aa1;
            padding: 15px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 4px 0 #bd9803;
            border-bottom: 4px solid #3c5aa1;
        }

        #quiz-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            gap: 20px;
            position: relative;
        }

        .score-board {
            position: absolute;
            top: 20px;
            right: 20px;
            background: white;
            border: 3px solid #3c5aa1;
            border-radius: 15px;
            padding: 5px 15px;
            font-size: 20px;
            font-weight: bold;
            color: #3c5aa1;
        }

        .question-box {
            background: white;
            border: 6px solid #3c5aa1;
            border-radius: 30px;
            padding: 20px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 8px 0 #b3d1ff;
            transition: transform 0.2s;
        }

        .question-text {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }

        .question-image {
            width: 180px;
            height: 180px;
            object-fit: contain;
            margin-bottom: 10px;
            border-radius: 15px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            width: 90%;
            max-width: 500px;
        }

        .option-btn {
            background: white;
            border: 4px solid #3c5aa1;
            border-radius: 20px;
            padding: 15px;
            font-size: 22px;
            font-weight: bold;
            color: #3c5aa1;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 6px 0 #b3d1ff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .option-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #b3d1ff;
        }

        .option-btn.correct {
            background: #c8e6c9;
            border-color: #4caf50;
            color: #2e7d32;
            box-shadow: 0 6px 0 #81c784;
        }

        .option-btn.wrong {
            background: #ffcdd2;
            border-color: #f44336;
            color: #c62828;
            box-shadow: 0 6px 0 #e57373;
        }

        .feedback-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            animation: fadeIn 0.3s;
        }

        .feedback-card {
            background: white;
            border: 6px solid #ffcb05;
            border-radius: 30px;
            padding: 30px;
            text-align: center;
            max-width: 80%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .feedback-emoji {
            font-size: 60px;
            margin-bottom: 10px;
        }

        .feedback-text {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .next-btn {
            background: #3c5aa1;
            color: white;
            border: none;
            border-radius: 15px;
            padding: 12px 30px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #2a3f8a;
        }

        .next-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #2a3f8a;
        }

        .nav-bar {
            background: #fff;
            border-top: 4px solid #3c5aa1;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-btn {
            background: #eee;
            border: 2px solid #ccc;
            border-radius: 10px;
            padding: 5px 15px;
            font-size: 16px;
            cursor: pointer;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Animations for Correct/Wrong */
        .pop {
            animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes pop {
            0% { transform: scale(0.8); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <header>Pokopia 猜謎挑戰 🦐</header>

    <div id="quiz-container">
        <div class="score-board">Score: <span id="current-score">0</span></div>
        
        <div class="question-box" id="question-box">
            <div class="question-text" id="question-text">準備好了嗎？</div>
            <div id="question-visual">
                <!-- Image or Text will go here -->
            </div>
        </div>

        <div class="options-grid" id="options-grid">
            <!-- Options will be generated here -->
        </div>
    </div>

    <div class="nav-bar">
        <button class="back-btn" onclick="window.location.href='index.html'">⬅️ 回到主頁</button>
        <div id="progress-text" style="font-weight: bold; color: #3c5aa1;">第 1 / 10 題</div>
    </div>

    <div class="feedback-overlay" id="feedback-overlay">
        <div class="feedback-card pop">
            <div class="feedback-emoji" id="feedback-emoji">✨</div>
            <div class="feedback-text" id="feedback-text">太棒了！</div>
            <div id="correct-answer-display" style="margin-bottom: 20px; font-size: 20px; color: #666;"></div>
            <button class="next-btn" id="next-btn">下一題 ➔</button>
        </div>
    </div>

    <script src="data/pokemon.json"></script>
    <script src="scripts/quiz.js"></script>
</body>
</html>
